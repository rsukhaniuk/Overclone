<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-tMD6tcs383IAqtdtI/YCpRsAFUuurIkGuS741AEYXbY='; script-src-attr 'none'; worker-src 'self' blob:; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'none'; manifest-src 'self'; connect-src 'self' http://localhost:11434 http://127.0.0.1:11434; frame-src 'none'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/" />
        <title>Document workspace</title>
        <link rel="stylesheet" href="app.css" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#202735" />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="icons/icon-192.png"
        />
        <link rel="apple-touch-icon" href="icons/icon-192.png" />
    </head>
    <body>
        <div id="app">Loading workspace…</div>
        <script
            src="_framework/blazor.webassembly.js?v=v10"
            autostart="false"
        ></script>
        <script>
            // Bound framework fetch admission through the supported runtime builder.
            let appStartupSucceeded = false;
            const appStarted = Blazor.start({
                // Stable boot filenames contain build-specific assembly names.
                // Version both entry points so an older active worker cannot
                // combine its cached runtime config with the new application.
                loadBootResource: (type, name, defaultUri) =>
                    type === "dotnetjs" ? `${defaultUri}?v=v10` : undefined,
                configureRuntime: (builder) =>
                    builder.withConfig({ maxParallelDownloads: 8 }),
            }).then(() => {
                appStartupSucceeded = true;
            });

            // Protect working bytes if the browser is closed before autosave settles.
            // Register only while dirty so clean pages can use the back-forward cache.
            const protectUnsavedChanges = event => {
                event.preventDefault();
                event.returnValue = "";
            };
            window.__oopSetUnsavedChanges = dirty => {
                if (dirty) window.addEventListener("beforeunload", protectUnsavedChanges);
                else window.removeEventListener("beforeunload", protectUnsavedChanges);
            };

            // Updates use the browser's normal waiting lifecycle. An open tab
            // keeps its current release until all clients of that release close.
            if ("serviceWorker" in navigator) {
                window.__oopOfflineReady = false;
                // Tri-state readiness so the .NET app can show an actionable
                // provisioning/incomplete notice ONLY when warming finished
                // incomplete (not during normal startup). The page subscribes via
                // the offline-readiness.js glue module; JS only reports the state.
                window.__oopOfflineReadiness = "unknown";

                async function warmRuntime() {
                    // Document load alone does not mean bounded runtime downloads finished.
                    await appStarted;
                    const controller = navigator.serviceWorker.controller;
                    if (!controller) return;
                    const urls = (
                        performance.getEntriesByType("resource") || []
                    ).flatMap((entry) => {
                        try {
                            const url = new URL(entry.name, location.href);
                            if (
                                url.origin !== location.origin ||
                                url.username ||
                                url.password
                            )
                                return [];
                            // Only public build assets, never document/API/provider
                            // responses. Query-bearing resources must additionally be
                            // known framework JS with the exact current shell version.
                            const publicAsset =
                                /^\/_framework\/[A-Za-z0-9_.-]+\.(?:js|wasm|json|dat|blat|pdb)$/.test(
                                    url.pathname,
                                ) ||
                                /^\/js\/[A-Za-z0-9_-]+\.js$/.test(
                                    url.pathname,
                                ) ||
                                /^\/(?:rust|native)-generated\/[A-Za-z0-9_.-]+\.(?:js|mjs|wasm)$/.test(
                                    url.pathname,
                                ) ||
                                /^\/icons\/icon-(?:192|512)\.png$/.test(
                                    url.pathname,
                                ) ||
                                [
                                    "/",
                                    "/index.html",
                                    "/app.css",
                                    "/manifest.json",
                                ].includes(url.pathname);
                            if (!publicAsset) return [];
                            if (url.search || url.href.includes("?")) {
                                // Both stable and fingerprinted runtime/native module
                                // names inherit the boot version at cold startup.
                                const frameworkJs =
                                    /^\/_framework\/(?:blazor\.webassembly|dotnet(?:\.(?:runtime|native))?)(?:\.[A-Za-z0-9_-]+)?\.js$/.test(
                                        url.pathname,
                                    );
                                if (!frameworkJs || url.search !== "?v=v10")
                                    return [];
                            }
                            return [url.pathname + url.search];
                        } catch {
                            return []; // Malformed performance entries cannot broaden warming.
                        }
                    });
                    // Include the document itself and core shell assets.
                    const set = new Set([
                        "/",
                        "/index.html",
                        "/app.css",
                        "/manifest.json",
                    ]);
                    // Explicitly provision the required independent-analysis assets.
                    // The lazy worker JS/WASM are loaded only when the user runs
                    // analysis, so they can be absent from performance resource
                    // entries on first load (nested worker imports especially).
                    // Offline readiness is honest only when ALL of these are
                    // cached; a missing asset keeps __oopOfflineReady false rather
                    // than falsely claiming a provisioned shell. Documents stay
                    // in OPFS/IndexedDB (never HTTP cache).
                    const ANALYSIS_ASSETS = [
                        "/js/rust-worker.js",
                        "/js/rust-bridge.js",
                        "/js/worker-bridge.js",
                        "/js/editor-select.js",
                        "/rust-generated/document_engine.js",
                        "/rust-generated/document_engine_bg.wasm",
                    ];
                    // On-demand UI glue required for offline export/folder
                    // operations (fetched lazily via JS interop, so absent from
                    // performance entries on first load). Warming them keeps M1b
                    // offline export working alongside the analysis assets.
                    const ON_DEMAND_GLUE = [
                        "/js/download.js",
                        "/js/folder-transfer.js",
                        "/js/offline-readiness.js",
                        "/js/compile-history-index.js",
                        "/js/compile-artifacts-storage.js",
                    ];
                    for (const a of ANALYSIS_ASSETS) set.add(a);
                    for (const a of ON_DEMAND_GLUE) set.add(a);
                    for (const p of urls) set.add(p);
                    controller.postMessage({
                        type: "warm",
                        urls: Array.from(set),
                    });
                }

                function onActivated() {
                    if (document.readyState === "complete") warmRuntime();
                    else
                        window.addEventListener("load", warmRuntime, {
                            once: true,
                        });
                }

                // Service-worker -> client messages arrive on the
                // ServiceWorkerContainer, not on window. Handle both the
                // activation signal and the warming readiness reply here.
                navigator.serviceWorker.addEventListener("message", (event) => {
                    const data = event.data;
                    if (!data) return;
                    if (data.type === "activated") onActivated();
                    else if (
                        data.type === "warm-result" &&
                        appStartupSucceeded
                    ) {
                        window.__oopOfflineReady = !!data.ready;
                        window.__oopOfflineReadiness = data.ready
                            ? "ready"
                            : "incomplete";
                        // Forward the browser warm-status event to the .NET app
                        // if it has subscribed (C# owns the visible message).
                        if (window.__oopOfflineReadinessSink)
                            window.__oopOfflineReadinessSink(
                                window.__oopOfflineReadiness,
                            );
                    }
                });

                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("/service-worker.js", {
                            updateViaCache: "none",
                        })
                        .then(() => {
                            if (navigator.serviceWorker.controller)
                                onActivated();
                        })
                        .catch((error) => {
                            console.warn(
                                "Service worker registration failed:",
                                error,
                            );
                        });
                });
            }

        </script>
    </body>
</html>
