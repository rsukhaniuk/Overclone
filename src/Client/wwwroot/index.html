<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/" />
        <title>Document workspace</title>
        <link rel="stylesheet" href="app.css" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#202735" />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="icons/icon-192.png"
        />
        <link rel="apple-touch-icon" href="icons/icon-192.png" />
    </head>
    <body>
        <div id="app">Loading workspace…</div>
        <script src="_framework/blazor.webassembly.js?v=v9" autostart="false"></script>
        <script>
            // Bound framework fetch admission through the supported runtime builder.
            let appStartupSucceeded = false;
            const appStarted = Blazor.start({
                // Stable boot filenames contain build-specific assembly names.
                // Version both entry points so an older active worker cannot
                // combine its cached runtime config with the new application.
                loadBootResource: (type, name, defaultUri) =>
                    type === "dotnetjs" ? `${defaultUri}?v=v9` : undefined,
                configureRuntime: (builder) =>
                    builder.withConfig({ maxParallelDownloads: 8 }),
            }).then(() => {
                appStartupSucceeded = true;
            });

            // Register the service worker for offline provisioning. An update never
            // force-reloads an active editing session: the page shows a banner and
            // lets the user reload when ready.
            //
            // Offline readiness: the page's first load usually happens before the
            // worker controls the client, so runtime assets are fetched from the
            // network and not cached by the fetch handler. On activation the worker
            // posts {type:'activated'}; the page then sends the worker the list of
            // same-origin resources it loaded, which the worker fetches+caches.
            // window.__oopOfflineReady becomes true only once that warming round
            // reports every asset cached, so callers can wait for a genuinely
            // provisioned shell rather than a freshly registered worker.
            if ("serviceWorker" in navigator) {
                window.__oopOfflineReady = false;
                // Tri-state readiness so the .NET app can show an actionable
                // provisioning/incomplete notice ONLY when warming finished
                // incomplete (not during normal startup). The page subscribes via
                // the offline-readiness.js glue module; JS only reports the state.
                window.__oopOfflineReadiness = "unknown";

                // App-scoped SW-UPDATE safety guard bridge. The C# `UpdateGuard`
                // component (rendered once at the app root) registers a
                // DotNetObjectReference here once Blazor boots; the update banner
                // forwards the user's "Reload to update" click to it. C# owns the
                // document/save policy; JS forwards the decision and manages the
                // SW / controllerchange events. Before Blazor boots the guard is
                // null and EVERY activation attempt FAILS CLOSED (no skipWaiting,
                // no reload) with a retry message — it never bypasses the gate.
                window.__oopSetUpdateGuard = function (dotNetRef) {
                    window.__oopUpdateGuard = dotNetRef;
                };
                window.__oopClearUpdateGuard = function () {
                    delete window.__oopUpdateGuard;
                };
                window.__oopUpdateGuardCanActivate = async function () {
                    var g = window.__oopUpdateGuard;
                    if (!g || typeof g.invokeMethodAsync !== "function")
                        return {
                            safe: false,
                            message:
                                "The app is still starting. Try again in a moment.",
                            action: "retry",
                        };
                    try {
                        return await g.invokeMethodAsync(
                            "CanActivateUpdateAsync",
                        );
                    } catch (e) {
                        return {
                            safe: false,
                            message:
                                "The app is still starting. Try again in a moment.",
                            action: "retry",
                        };
                    }
                };

                async function warmRuntime() {
                    // Document load alone does not mean bounded runtime downloads finished.
                    await appStarted;
                    const controller = navigator.serviceWorker.controller;
                    if (!controller) return;
                    const urls = (
                        performance.getEntriesByType("resource") || []
                    )
                        .map((e) => e.name)
                        .filter(
                            (u) =>
                                new URL(u, location.href).origin ===
                                location.origin,
                        )
                        .map((u) => {
                            const url = new URL(u, location.href);
                            const versionedBoot =
                                url.pathname === "/_framework/blazor.webassembly.js" ||
                                url.pathname === "/_framework/dotnet.js";
                            return url.pathname + (versionedBoot ? url.search : "");
                        });
                    // Include the document itself and core shell assets.
                    const set = new Set([
                        "/",
                        "/index.html",
                        "/app.css",
                        "/manifest.json",
                    ]);
                    // Explicitly provision the required independent-analysis assets.
                    // The lazy worker JS/WASM are loaded only when the user runs
                    // analysis, so they can be absent from performance resource
                    // entries on first load (nested worker imports especially).
                    // Offline readiness is honest only when ALL of these are
                    // cached; a missing asset keeps __oopOfflineReady false rather
                    // than falsely claiming a provisioned shell. Documents stay
                    // in OPFS/IndexedDB (never HTTP cache).
                    const ANALYSIS_ASSETS = [
                        "/js/rust-worker.js",
                        "/js/rust-bridge.js",
                        "/js/worker-bridge.js",
                        "/js/editor-select.js",
                        "/rust-generated/document_engine.js",
                        "/rust-generated/document_engine_bg.wasm",
                    ];
                    // On-demand UI glue required for offline export/folder
                    // operations (fetched lazily via JS interop, so absent from
                    // performance entries on first load). Warming them keeps M1b
                    // offline export working alongside the analysis assets.
                    const ON_DEMAND_GLUE = [
                        "/js/download.js",
                        "/js/folder-transfer.js",
                        "/js/offline-readiness.js",
                        "/js/compile-history-index.js",
                        "/js/compile-artifacts-storage.js",
                        "/js/google-drive-auth.js",
                    ];
                    for (const a of ANALYSIS_ASSETS) set.add(a);
                    for (const a of ON_DEMAND_GLUE) set.add(a);
                    for (const p of urls) set.add(p);
                    controller.postMessage({
                        type: "warm",
                        urls: Array.from(set),
                    });
                }

                function onActivated() {
                    if (document.readyState === "complete") warmRuntime();
                    else
                        window.addEventListener("load", warmRuntime, {
                            once: true,
                        });
                }

                // Service-worker -> client messages arrive on the
                // ServiceWorkerContainer, not on window. Handle both the
                // activation signal and the warming readiness reply here.
                navigator.serviceWorker.addEventListener("message", (event) => {
                    const data = event.data;
                    if (!data) return;
                    if (data.type === "activated") onActivated();
                    else if (data.type === "warm-result" && appStartupSucceeded) {
                        window.__oopOfflineReady = !!data.ready;
                        window.__oopOfflineReadiness = data.ready
                            ? "ready"
                            : "incomplete";
                        // Forward the browser warm-status event to the .NET app
                        // if it has subscribed (C# owns the visible message).
                        if (window.__oopOfflineReadinessSink)
                            window.__oopOfflineReadinessSink(
                                window.__oopOfflineReadiness,
                            );
                    }
                });

                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("/service-worker.js")
                        .then((reg) => {
                            reg.addEventListener("updatefound", () => {
                                const installing = reg.installing;
                                if (!installing) return;
                                installing.addEventListener(
                                    "statechange",
                                    () => {
                                        // A NEW worker has finished installing and
                                        // is WAITING to activate (the old worker
                                        // is still the active controller). Show the
                                        // banner so the user can accept it; do NOT
                                        // force-reload an active editing session.
                                        if (
                                            installing.state === "installed" &&
                                            navigator.serviceWorker.controller
                                        ) {
                                            showUpdateBanner(reg);
                                        }
                                    },
                                );
                            });
                            // If the worker was already active before this script ran
                            // (e.g. a reload), drive warming now.
                            if (navigator.serviceWorker.controller)
                                onActivated();
                            // A previously installed update may already be waiting
                            // when this page opens; updatefound will not fire again.
                            if (reg.waiting && navigator.serviceWorker.controller)
                                showUpdateBanner(reg);
                        })
                        .catch((error) => {
                            console.warn(
                                "Service worker registration failed:",
                                error,
                            );
                        });
                });
            }

            function showUpdateGuidance(message) {
                var existing = document.getElementById("update-guidance");
                if (existing) existing.remove();
                if (!message) return;
                var g = document.createElement("div");
                g.id = "update-guidance";
                g.setAttribute("data-testid", "update-guidance");
                g.className = "update-guidance";
                g.textContent = message;
                var banner = document.getElementById("update-banner");
                if (banner) banner.appendChild(g);
                else document.body.prepend(g);
            }
            function hideUpdateGuidance() {
                var existing = document.getElementById("update-guidance");
                if (existing) existing.remove();
            }

            function showUpdateBanner(reg) {
                if (document.getElementById("update-banner")) return;
                const banner = document.createElement("div");
                banner.id = "update-banner";
                banner.className = "update-banner";
                banner.innerHTML = "<span>A new version is ready.</span>";
                const btn = document.createElement("button");
                btn.textContent = "Reload to update";
                btn.addEventListener("click", async () => {
                    hideUpdateGuidance();
                    // GATE on current workspace safety FIRST (C# owns the policy).
                    // Refuse while unsaved work would be lost; never bypass when
                    // the guard is unavailable (fail CLOSED). No skipWaiting / no
                    // reload until C# says it is safe.
                    var decision = await window.__oopUpdateGuardCanActivate();
                    if (!decision || !decision.safe) {
                        showUpdateGuidance(
                            (decision && decision.message) ||
                                "Save your changes, then reload to update.",
                        );
                        return;
                    }
                    // Target the WAITING (new) worker, not the active controller,
                    // and reload only after the actual controllerchange so an
                    // active editing session is not force-reloaded into a worker
                    // that has not yet taken over. Documents in OPFS/IndexedDB are
                    // never deleted.
                    const waiting = reg && reg.waiting;
                    if (waiting) {
                        let reloaded = false;
                        const onControllerChange = async () => {
                            if (reloaded) return;
                            reloaded = true;
                            navigator.serviceWorker.removeEventListener(
                                "controllerchange",
                                onControllerChange,
                            );
                            // RECHECK before reload: edits may have landed during
                            // the activation wait. A now-dirty session must keep
                            // its draft (refuse the reload) even though skipWaiting
                            // already ran — the user Saves then clicks again.
                            var d2 = await window.__oopUpdateGuardCanActivate();
                            if (!d2 || !d2.safe) {
                                showUpdateGuidance(
                                    (d2 && d2.message) ||
                                        "Save your changes, then reload to update.",
                                );
                                return;
                            }
                            location.reload();
                        };
                        navigator.serviceWorker.addEventListener(
                            "controllerchange",
                            onControllerChange,
                        );
                        waiting.postMessage("skipWaiting");
                        // Bounded safety: if no controllerchange arrives in time,
                        // RECHECK then reload ONLY if still safe. The fallback
                        // never calls an unconditional location.reload and never
                        // bypasses the gate.
                        setTimeout(async () => {
                            if (!reloaded) {
                                reloaded = true;
                                navigator.serviceWorker.removeEventListener(
                                    "controllerchange",
                                    onControllerChange,
                                );
                                var d2 =
                                    await window.__oopUpdateGuardCanActivate();
                                if (!d2 || !d2.safe) {
                                    showUpdateGuidance(
                                        (d2 && d2.message) ||
                                            "Save your changes, then reload to update.",
                                    );
                                    return;
                                }
                                location.reload();
                            }
                        }, 4000);
                    } else {
                        // No waiting worker (already activated): recheck then reload.
                        var d2 = await window.__oopUpdateGuardCanActivate();
                        if (!d2 || !d2.safe) {
                            showUpdateGuidance(
                                (d2 && d2.message) ||
                                    "Save your changes, then reload to update.",
                            );
                            return;
                        }
                        location.reload();
                    }
                });
                banner.appendChild(btn);
                document.body.prepend(banner);
            }
        </script>
    </body>
</html>
