<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; worker-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Refresh Overclone</title>
    <link rel="stylesheet" href="/app.css?release-recovery=2">
    <script src="/release-recovery.js?release-recovery=2" defer></script>
</head>
<body>
    <main class="release-recovery">
        <h1>Refresh Overclone</h1>
        <p>Save your work before refreshing Overclone.</p>
        <p>Your saved projects will stay in this browser.</p>
        <button type="button" id="refresh-release" disabled>Open current build</button>
        <p role="status" id="refresh-status"></p>
        <noscript>Enable JavaScript to refresh Overclone.</noscript>
    </main>
</body>
</html>
